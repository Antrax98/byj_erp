services:
  mysql:
    image: mysql:8.3
    container_name: kmp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kmp_db
      MYSQL_USER: kmp_user
      MYSQL_PASSWORD: kmp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
